# Cloudflare Pages: app estática em .publicar/ (ver scripts/publicar.sh) e funções em functions/.
name = "saladeespera"
pages_build_output_dir = ".publicar"
compatibility_date = "2026-10-01"

# Contador de visitas (só totais por dia; esquema em server/visitas.sql).
[[d1_databases]]
binding = "DB"
database_name = "sala-de-espera"
database_id = "672e2377-3037-47d4-af60-8bc1bf31aa42"

# Ranking online, Fase 8.1: iterações do PBKDF2 das palavras-passe (máximo da Cloudflare: 100 000).
# O plano gratuito dá ~10 ms de CPU por pedido: o valor fica o maior que caiba, medido no ar (ver o PLANO).
[vars]
PBKDF2_ITER = "60000"
