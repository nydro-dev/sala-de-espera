<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="description" content="Sudoku, Minas, Palavras, Solitário, Dobra, Cobra, Blackjack e Roleta para os intervalos, com desafio do dia, duelos por link, estatísticas e ranking local.">
<link rel="manifest" href="manifest.webmanifest">

<script>
/* Aplica o tema antes de desenhar, para não piscar. */
(function(){try{var s=JSON.parse(localStorage.getItem("sde:settings")||"{}");if(s.theme==="light"||s.theme==="dark")document.documentElement.dataset.theme=s.theme;var r=s.anim==="always"||(s.anim!=="reduced"&&!matchMedia("(prefers-reduced-motion: reduce)").matches);if(r)document.documentElement.classList.add("anim")}catch(e){}})();
</script>

<body>

<div id="app">

  <!-- Menu de entrada -->
  <main class="view menu" id="v-menu">
    <header class="menu-head">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect width="100" height="100" rx="22" fill="#1E4FA3"/><path d="M29.0 14H71.0A15.0 15.0 0 0 0 86 29.0V71.0A15.0 15.0 0 0 0 71.0 86H29.0A15.0 15.0 0 0 0 14 71.0V29.0A15.0 15.0 0 0 0 29.0 14Z" fill="#F5F7FB"/><circle cx="50.0" cy="38.5" r="8.5" fill="#1E4FA3"/><circle cx="61.5" cy="50.0" r="8.5" fill="#1E4FA3"/><circle cx="50.0" cy="61.5" r="8.5" fill="#1E4FA3"/><circle cx="38.5" cy="50.0" r="8.5" fill="#1E4FA3"/><circle cx="50.0" cy="50.0" r="6.5" fill="#E0A526"/><path d="M33.0 28.8l4.2 4.2 -4.2 4.2 -4.2 -4.2z" fill="#1E4FA3"/><path d="M67.0 28.8l4.2 4.2 -4.2 4.2 -4.2 -4.2z" fill="#1E4FA3"/><path d="M33.0 62.8l4.2 4.2 -4.2 4.2 -4.2 -4.2z" fill="#1E4FA3"/><path d="M67.0 62.8l4.2 4.2 -4.2 4.2 -4.2 -4.2z" fill="#1E4FA3"/></svg>
        <div>
          <h1>Sala de Espera</h1>
          <p class="sub">Jogos curtos para os intervalos</p>
        </div>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="m-rank" aria-label="Ranking e estatísticas"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/></svg></button>
        <button class="icon-btn" id="m-settings" aria-label="Definições"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </header>
    <section class="daily" id="m-daily" aria-label="Desafio do dia" hidden></section>
    <button class="duel-in-btn" id="m-duel-in" type="button"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5L18 3h3v3l-3.5 3.5"/><path d="M5 14l4 4M7 17l-3 3M3 19l2 2"/></svg></span><span class="txt"><b>Duelo recebido</b><small>Escreve o código que te mandaram</small></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="mn-shelves" id="m-cards"></div>
    <footer class="menu-foot">Os jogos e o ranking ficam guardados só neste aparelho. <a href="privacidade.html">Privacidade</a></footer>
  </main>

  <!-- Ecrã de jogo (estrutura comum a todos os jogos) -->
  <main class="view game" id="v-game" hidden>
    <header class="topbar">
      <button class="icon-btn" id="g-back" aria-label="Voltar ao menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="g-title">Jogo</h2>
      <button class="icon-btn" id="g-help" aria-label="Como jogar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg></button>
      <button class="icon-btn" id="g-rank" aria-label="Ranking e estatísticas deste jogo"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/></svg></button>
    </header>
    <div class="game-body">
      <div class="stats" id="g-stats"></div>
      <div class="board-area" id="g-board"></div>
      <div class="controls" id="g-controls"></div>
    </div>
  </main>

</div>

<!-- Janela modal partilhada (ajuda, ranking, definições, resultados) -->
<dialog id="modal" aria-labelledby="modal-title">
  <div class="modal-card">
    <header class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
