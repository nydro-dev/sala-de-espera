<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F3">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sala de Espera">
<meta name="description" content="Sudoku, Minas, Blackjack e Roleta para os intervalos, com ranking local.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Sala de Espera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/base.css">
<script>
/* Aplica o tema antes de desenhar, para não piscar. */
(function(){try{var s=JSON.parse(localStorage.getItem("sde:settings")||"{}");if(s.theme==="light"||s.theme==="dark")document.documentElement.dataset.theme=s.theme}catch(e){}})();
</script>
</head>
<body>

<div id="app">

  <!-- Menu de entrada -->
  <main class="view menu" id="v-menu">
    <header class="menu-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i class="dot"></i></span>
        <div>
          <h1>Sala de Espera</h1>
          <p class="sub">Jogos curtos para os intervalos</p>
        </div>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="m-rank" aria-label="Ranking"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/></svg></button>
        <button class="icon-btn" id="m-settings" aria-label="Definições"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </header>
    <section class="cards" id="m-cards" aria-label="Jogos"></section>
    <footer class="menu-foot">Os jogos e o ranking ficam guardados só neste aparelho.</footer>
  </main>

  <!-- Ecrã de jogo (estrutura comum a todos os jogos) -->
  <main class="view game" id="v-game" hidden>
    <header class="topbar">
      <button class="icon-btn" id="g-back" aria-label="Voltar ao menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="g-title">Jogo</h2>
      <button class="icon-btn" id="g-help" aria-label="Como jogar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg></button>
      <button class="icon-btn" id="g-rank" aria-label="Ranking deste jogo"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/></svg></button>
    </header>
    <div class="game-body">
      <div class="stats" id="g-stats"></div>
      <div class="board-area" id="g-board"></div>
      <div class="controls" id="g-controls"></div>
    </div>
  </main>

</div>

<!-- Janela modal partilhada (ajuda, ranking, definições, resultados) -->
<dialog id="modal" aria-labelledby="modal-title">
  <div class="modal-card">
    <header class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script src="js/core.js"></script>
<script src="js/games/sudoku.js"></script>
<script src="js/games/minas.js"></script>
<script src="js/games/casino.js"></script>
<script src="js/games/blackjack.js"></script>
<script src="js/games/roleta.js"></script>
<script src="js/app.js"></script>
</body>
</html>
